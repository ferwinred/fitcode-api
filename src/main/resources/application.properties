spring.application.name=fitcode-api

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=fitness-app

# Spring security settings
spring.security.user.name=admin
spring.security.user.password=changeme

# ejemplo application.properties
app.seed.admin.username=admin
app.seed.admin.email=admin@miapp.com
app.seed.admin.password=securepass123

logging.level.org.springframework.security=DEBUG
logging.level.com.fitcode.fitcode_api=DEBUG

